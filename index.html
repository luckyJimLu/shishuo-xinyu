<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#eee6d2" />
<title>世说新语 · 古籍阅读</title>
<style>
:root{--paper:#f3ecd8;--paper2:#ece3cc;--ink:#2d241b;--muted:#736451;--line:#d8cbaa;--side:#eee5cf;--accent:#8b3b2f;--accent2:#b6664d;--shadow:0 12px 40px rgba(74,52,30,.12);--fs:20px;--lh:2.05}
html.dark{--paper:#211c16;--paper2:#19150f;--ink:#ded2bd;--muted:#aa9b82;--line:#3b3226;--side:#1d1913;--accent:#d48668;--accent2:#bb7059;--shadow:0 12px 40px rgba(0,0,0,.38)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}
.top{height:58px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--side),var(--paper2));position:relative;z-index:30}.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:2px;white-space:nowrap}.seal{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;background:var(--accent);color:#f8efd8;font-size:17px}.brand small{font-size:12px;color:var(--muted);font-weight:400;letter-spacing:0}.search{position:relative;flex:1;max-width:520px}.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:22px;background:var(--paper);color:var(--ink);outline:0;padding:0 36px 0 38px}.search:before{content:"⌕";position:absolute;left:13px;top:7px;color:var(--muted);font-size:20px}.tools{margin-left:auto;display:flex;gap:6px}.btn{height:35px;min-width:35px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted);cursor:pointer}.btn:hover,.btn.on{border-color:var(--accent2);color:var(--accent);background:var(--paper2)}.menu{display:none}
.main{height:calc(100% - 58px);display:flex;position:relative}.side{width:286px;flex:0 0 auto;border-right:1px solid var(--line);background:var(--side);display:flex;flex-direction:column;z-index:20}.side-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);letter-spacing:1px}.chapters{overflow:auto;padding:8px}.chapter{border-radius:8px;padding:9px 11px;display:flex;gap:10px;align-items:baseline;cursor:pointer;border-left:3px solid transparent}.chapter:hover{background:var(--paper2);color:var(--accent)}.chapter.active{background:var(--paper2);color:var(--accent);border-left-color:var(--accent);font-weight:700}.num{font-size:11px;color:var(--muted)}.count{margin-left:auto;font-size:11px;color:var(--muted)}
.reader{flex:1;min-width:0;overflow:auto;position:relative;scroll-behavior:smooth}.progress{height:3px;background:var(--accent);width:0;position:sticky;top:0;z-index:9}.paper{max-width:44em;margin:0 auto;padding:48px 34px 120px}.book-title{text-align:center;font-size:31px;margin:0;letter-spacing:5px}.meta{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}.rule{width:66px;height:2px;background:var(--accent);opacity:.55;margin:20px auto 34px}.chapter-title{text-align:center;font-size:22px;color:var(--accent);letter-spacing:3px;margin:0 0 30px}.chapter-title:before,.chapter-title:after{content:"◆";font-size:9px;vertical-align:middle;margin:0 12px;opacity:.55}.entry-wrap{margin-bottom:1.35em}.entry{font-size:var(--fs);line-height:var(--lh);letter-spacing:.035em;text-align:justify;text-indent:2em;margin:0}.entry mark{background:color-mix(in srgb,var(--accent) 22%,transparent);color:inherit}.annotated{position:relative;border-bottom:1px dotted var(--accent);cursor:pointer}.annotated sup{font-size:.5em;color:var(--accent);margin-left:.08em}.note-pop{display:none;margin:.45em 0 .25em 2em;padding:.6em .85em;border-left:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 5%,transparent);color:var(--muted);font-size:14px;line-height:1.75;text-indent:0}.note-pop.show{display:block}.note-pop b{color:var(--accent);font-weight:600}.translation{font-size:calc(var(--fs) - 2px);line-height:1.85;color:var(--muted);margin:.55em 0 0 2em;padding:.55em .8em;border-left:2px solid var(--accent2);text-indent:0}.translation .tag{display:inline-grid;place-items:center;width:1.55em;height:1.55em;margin-right:.6em;border:1px solid var(--accent);color:var(--accent);font-size:.75em}.missing{font-size:12px;color:var(--muted);text-align:center;margin:-12px 0 25px}.empty{text-align:center;color:var(--muted);padding:80px 20px;line-height:2}
.reader.vertical .paper{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;max-width:none;width:max-content;height:100%;padding:42px 58px}.reader.vertical .book-title,.reader.vertical .chapter-title{text-align:start;margin:0 0 0 24px}.reader.vertical .meta,.reader.vertical .rule{display:none}.reader.vertical .entry{height:100%;margin:0 0 0 1.25em;text-indent:2em}.reader.vertical .translation,.reader.vertical .note-pop{height:100%;margin:0 0 0 .8em;padding:.6em;border-left:0;border-top:2px solid var(--accent2);writing-mode:vertical-rl}.scrim{display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:15}.fab{position:absolute;right:22px;bottom:24px;width:46px;height:46px;border:0;border-radius:50%;background:var(--accent);color:#f7ecd6;box-shadow:var(--shadow);font-size:20px;display:none;cursor:pointer}.fab.show{display:block}.welcome{max-width:720px;margin:0 auto;padding:70px 30px;text-align:center}.welcome .big-seal{width:78px;height:78px;border:3px double var(--accent);color:var(--accent);margin:0 auto 24px;display:grid;place-items:center;font-size:28px;font-weight:700}.welcome h1{font-size:34px;letter-spacing:8px;margin:0 0 12px}.welcome p{color:var(--muted);line-height:1.9}.welcome button{margin-top:18px;background:var(--accent);color:#f8efd8;border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
@media(max-width:820px){.menu{display:inline-block}.brand .label,.brand small,.tools .txt{display:none}.top{padding:0 7px;gap:5px}.search{min-width:70px}.btn{padding:0 7px}.side{position:absolute;inset:0 auto 0 0;transform:translateX(-100%);transition:.22s;box-shadow:var(--shadow)}.side.open{transform:translateX(0)}.scrim.show{display:block}.paper{padding:32px 20px 100px}:root{--fs:18px}.chapter-title{margin-bottom:24px}}
</style></head><body>
<header class="top"><button id="menuBtn" class="btn menu">☰</button><div class="brand"><span class="seal">世</span><span class="label">世说新语</span><small>刘义庆 撰 · 刘孝标 注</small></div><div class="search"><input id="search" type="search" placeholder="检索当前篇正文…" autocomplete="off" /></div><div class="tools"><button id="homeBtn" class="btn" title="首页">⌂</button><button id="minusBtn" class="btn">A−</button><button id="plusBtn" class="btn">A＋</button><button id="notesBtn" class="btn" title="显示注释">注</button><button id="transBtn" class="btn" title="显示译文">译</button><button id="dirBtn" class="btn" title="横竖排"><span class="txt">竖排</span>↔</button><button id="themeBtn" class="btn">☾</button></div></header>
<div class="main"><div id="scrim" class="scrim"></div><aside id="side" class="side"><div class="side-head"><span>三十六门</span><span id="total"></span></div><nav id="chapters" class="chapters"></nav></aside><main id="reader" class="reader"><div id="progress" class="progress"></div><div id="content"></div><button id="topBtn" class="fab">↑</button></main></div>
<script>
"use strict";const $=s=>document.querySelector(s);const LS={theme:"ssxy_theme",fs:"ssxy_fs",dir:"ssxy_dir",notes:"ssxy_notes",trans:"ssxy_trans",chapter:"ssxy_chapter",pos:"ssxy_pos"};let book=[],current=-1,query="",notesData={},translationsData={};const cn=["一","二","三","四","五","六","七","八","九","十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","二十一","二十二","二十三","二十四","二十五","二十六","二十七","二十八","二十九","三十","三十一","三十二","三十三","三十四","三十五","三十六"];
init();async function init(){restorePrefs();bind();try{const r=await fetch("./data/shishuo-xinyu.json");if(!r.ok)throw new Error("HTTP "+r.status);const data=await r.json();book=Array.isArray(data)?data:(data.articles||data.content||data.data||[]);const [nr,tr]=await Promise.all([fetch("./data/annotations.json"),fetch("./data/translations.json")]);if(nr.ok)notesData=await nr.json();if(tr.ok)translationsData=await tr.json();if(!book.length)throw new Error("未识别正文数据结构");renderNav();$("#total").textContent=book.length+" 篇";const hash=decodeURIComponent(location.hash.replace(/^#\/chapter\//,""));const saved=parseInt(localStorage.getItem(LS.chapter)||"-1",10);const idx=hash?book.findIndex(x=>x.title===hash):(saved>=0&&saved<book.length?saved:-1);if(idx>=0)openChapter(idx,true);else showHome()}catch(e){$("#content").innerHTML='<div class="empty">正文加载失败：'+esc(e.message)+'</div>'}}
function bind(){$("#menuBtn").onclick=()=>toggleSide(true);$("#scrim").onclick=()=>toggleSide(false);$("#homeBtn").onclick=()=>{history.replaceState(null,"",location.pathname);showHome()};$("#minusBtn").onclick=()=>setFs(curFs()-1);$("#plusBtn").onclick=()=>setFs(curFs()+1);$("#notesBtn").onclick=()=>{localStorage.setItem(LS.notes,localStorage.getItem(LS.notes)==="on"?"off":"on");syncBtns();renderChapter()};$("#transBtn").onclick=()=>{localStorage.setItem(LS.trans,localStorage.getItem(LS.trans)==="on"?"off":"on");syncBtns();renderChapter()};$("#themeBtn").onclick=()=>{document.documentElement.classList.toggle("dark");localStorage.setItem(LS.theme,document.documentElement.classList.contains("dark")?"dark":"light");syncBtns()};$("#dirBtn").onclick=()=>{const on=!$("#reader").classList.contains("vertical");$("#reader").classList.toggle("vertical",on);localStorage.setItem(LS.dir,on?"v":"h");syncBtns();renderChapter()};$("#search").oninput=e=>{query=e.target.value.trim();if(current>=0)renderChapter()};$("#reader").addEventListener("scroll",onScroll,{passive:true});$("#topBtn").onclick=()=>$("#reader").scrollTo({top:0,left:0,behavior:"smooth"});$("#content").onclick=e=>{const a=e.target.closest(".annotated");if(a){const p=a.closest(".entry-wrap").querySelector('.note-pop[data-word="'+CSS.escape(a.dataset.word)+'"]');if(p)p.classList.toggle("show")}};window.onhashchange=()=>{const t=decodeURIComponent(location.hash.replace(/^#\/chapter\//,""));const i=book.findIndex(x=>x.title===t);if(i>=0&&i!==current)openChapter(i,true)}}
function restorePrefs(){if(localStorage.getItem(LS.theme)==="dark")document.documentElement.classList.add("dark");setFs(parseInt(localStorage.getItem(LS.fs)||"20"),true);syncBtns()}function setFs(v,silent=false){v=Math.max(15,Math.min(30,v||20));document.documentElement.style.setProperty("--fs",v+"px");if(!silent)localStorage.setItem(LS.fs,String(v))}function curFs(){return parseInt(getComputedStyle(document.documentElement).getPropertyValue("--fs"))||20}function syncBtns(){const dark=document.documentElement.classList.contains("dark");$("#themeBtn").textContent=dark?"☀":"☾";$("#notesBtn").classList.toggle("on",localStorage.getItem(LS.notes)==="on");$("#transBtn").classList.toggle("on",localStorage.getItem(LS.trans)==="on");$("#dirBtn").classList.toggle("on",localStorage.getItem(LS.dir)==="v");if(localStorage.getItem(LS.dir)==="v")$("#reader")?.classList.add("vertical")}
function renderNav(){const n=$("#chapters");n.innerHTML="";book.forEach((ch,i)=>{const b=document.createElement("div");b.className="chapter";b.innerHTML='<span class="num">'+String(i+1).padStart(2,"0")+'</span><span>'+esc(ch.title)+'</span><span class="count">'+(ch.content?.length||0)+'</span>';b.onclick=()=>openChapter(i);n.appendChild(b)})}function showHome(){current=-1;$("#content").innerHTML='<section class="welcome"><div class="big-seal">世说</div><h1>世说新语</h1><p>刘宋 · 刘义庆 撰　梁 · 刘孝标 注</p><p>原文为阅读主层；注释与现代汉语译文按需开启，译文默认隐藏。</p><button id="startBtn">开始阅读 · 德行第一</button></section>';$("#startBtn").onclick=()=>openChapter(0);$("#reader").scrollTop=0}
function openChapter(i,route=false){if(i<0||i>=book.length)return;current=i;query="";$("#search").value="";localStorage.setItem(LS.chapter,String(i));if(!route)location.hash="#/chapter/"+encodeURIComponent(book[i].title);renderChapter();document.querySelectorAll(".chapter").forEach((x,j)=>x.classList.toggle("active",j===i));toggleSide(false);document.title=book[i].title+" · 世说新语"}
function renderChapter(){if(current<0)return;const ch=book[current],q=query.toLowerCase(),showNotes=localStorage.getItem(LS.notes)==="on",showTrans=localStorage.getItem(LS.trans)==="on";let entries=(ch.content||[]).map((p,i)=>{const raw=String(p);if(q&&!raw.toLowerCase().includes(q))return"";const key=ch.title+":"+(i+1),notes=Array.isArray(notesData[key])?notesData[key]:[],trans=translationsData[key];let html=esc(raw);if(showNotes){for(const n of notes){const word=esc(n.word);html=html.replace(word,'<span class="annotated" data-word="'+word+'">'+word+'<sup>注</sup></span>')}}if(q&&!showNotes){const at=raw.toLowerCase().indexOf(q);if(at>=0)html=esc(raw.slice(0,at))+"<mark>"+esc(raw.slice(at,at+query.length))+"</mark>"+esc(raw.slice(at+query.length))}let noteHtml="";if(showNotes)noteHtml=notes.map(n=>'<div class="note-pop" data-word="'+esc(n.word)+'"><b>'+esc(n.word)+'</b>　'+esc(n.note)+'</div>').join("");return '<section class="entry-wrap"><p class="entry">'+html+'</p>'+noteHtml+(showTrans&&trans?'<p class="translation"><span class="tag">译</span>'+esc(trans)+'</p>':'')+'</section>'}).filter(Boolean).join("");if(!entries)entries='<div class="empty">当前篇未找到 “'+esc(query)+'”</div>';const status=(showNotes||showTrans)?'<div class="missing">'+(showNotes?'注释开启':'')+(showNotes&&showTrans?' · ':'')+(showTrans?'译文开启':'')+'</div>':'';$("#content").innerHTML='<article class="paper"><h1 class="book-title">世说新语</h1><div class="meta">刘宋 · 刘义庆 撰　梁 · 刘孝标 注</div><div class="rule"></div><h2 class="chapter-title">'+esc(ch.title)+'第'+cn[current]+'</h2>'+status+entries+'</article>';$("#reader").scrollTop=0;$("#reader").scrollLeft=0;onScroll()}
function onScroll(){const r=$("#reader"),max=r.scrollHeight-r.clientHeight,ratio=max>0?r.scrollTop/max:0;$("#progress").style.width=(ratio*100)+"%";$("#topBtn").classList.toggle("show",r.scrollTop>500)}function toggleSide(on){$("#side").classList.toggle("open",on);$("#scrim").classList.toggle("show",on)}function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
