<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#eee6d2" />
    <title>中国古典文学 · 诗文藏书</title>
    <meta
      name="description"
      content="中国古典文学阅读站：读唐诗宋词，品世说风流。支持作者与诗句检索、横竖排、夜间主题和阅读位置记忆。"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <header class="top">
      <button
        aria-controls="side"
        aria-expanded="false"
        id="menuBtn"
        aria-label="打开目录"
        class="btn menu"
      >
        ☰
      </button>
      <div class="brand">
        <span class="seal">文</span><span class="label">中国古典文学</span>
      </div>
      <div class="search">
        <button
          id="clearSearch"
          class="clear-search"
          aria-label="清除检索"
          hidden
        >
          ×</button
        ><input
          aria-label="检索当前篇正文"
          id="search"
          type="search"
          placeholder="检索当前篇正文…"
          autocomplete="off"
        />
      </div>
      <div class="tools">
        <button
          id="homeBtn"
          class="btn"
          title="返回藏书首页"
          aria-label="返回藏书首页"
        >
          ⌂</button
        ><button id="minusBtn" aria-label="缩小字号" class="btn">A−</button
        ><button id="plusBtn" aria-label="放大字号" class="btn">A＋</button
        ><button
          id="knowledgeBtn"
          class="btn"
          aria-label="名物研读"
          aria-pressed="false"
          hidden
        >
          名物</button
        ><button id="notesBtn" class="btn" title="显示注释">注</button
        ><button id="transBtn" class="btn" title="显示译文">译</button
        ><button id="dirBtn" aria-label="切换横竖排" class="btn" title="横竖排">
          <span class="txt">竖排</span>↔</button
        ><a
          id="atlasLink"
          class="btn"
          href="#/atlas"
          aria-label="文学地图"
          title="文学地图"
          >地图</a
        ><button id="themeBtn" aria-label="切换主题" class="btn">☾</button>
      </div>
    </header>
    <div class="main library-view">
      <div
        id="progress"
        class="progress"
        role="progressbar"
        aria-label="阅读进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      ></div>
      <div id="scrim" class="scrim"></div>
      <aside id="side" class="side">
        <div class="side-head">
          <span id="navTitle">藏书目录</span><span id="total"></span>
        </div>
        <div id="bookNav" class="book-nav"></div>
        <nav id="chapters" class="chapters" aria-label="书目与篇目"></nav>
      </aside>
      <main id="reader" class="reader">
        <div id="loadStatus" role="status" aria-live="polite"></div>
        <div id="content"><div class="empty">正在打开藏书…</div></div>
        <button id="topBtn" aria-label="返回阅读起点" class="fab">↑</button>
      </main>
      <aside
        id="researchPanel"
        class="research-panel"
        aria-label="名物研读"
        hidden
      ></aside>
    </div>
    <dialog
      id="researchDialog"
      class="research-dialog"
      aria-label="名物研读"
    ></dialog>
    <script type="module" src="./assets/reader.js"></script>
  </body>
</html>
