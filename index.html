<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#eee6d2" />
    <title>世说新语 · 古籍阅读</title>
    <style>
      :root {
        --paper: #f3ecd8;
        --paper2: #ece3cc;
        --ink: #2d241b;
        --muted: #736451;
        --line: #d8cbaa;
        --side: #eee5cf;
        --accent: #8b3b2f;
        --accent2: #b6664d;
        --shadow: 0 12px 40px rgba(74, 52, 30, 0.12);
        --fs: 20px;
        --lh: 2.05;
      }
      html.dark {
        --paper: #211c16;
        --paper2: #19150f;
        --ink: #ded2bd;
        --muted: #aa9b82;
        --line: #3b3226;
        --side: #1d1913;
        --accent: #d48668;
        --accent2: #bb7059;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.38);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family:
          "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC",
          "SimSun", serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input {
        font: inherit;
      }
      .top {
        height: 58px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, var(--side), var(--paper2));
        position: relative;
        z-index: 30;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: 700;
        letter-spacing: 2px;
        white-space: nowrap;
      }
      .seal {
        width: 32px;
        height: 32px;
        border-radius: 6px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #f8efd8;
        font-size: 17px;
      }
      .brand small {
        font-size: 12px;
        color: var(--muted);
        font-weight: 400;
        letter-spacing: 0;
      }
      .search {
        position: relative;
        flex: 1;
        max-width: 520px;
      }
      .search input {
        width: 100%;
        height: 38px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--paper);
        color: var(--ink);
        outline: 0;
        padding: 0 36px 0 38px;
      }
      .search:before {
        content: "⌕";
        position: absolute;
        left: 13px;
        top: 7px;
        color: var(--muted);
        font-size: 20px;
      }
      .tools {
        margin-left: auto;
        display: flex;
        gap: 6px;
      }
      .btn {
        height: 35px;
        min-width: 35px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--muted);
        cursor: pointer;
      }
      .btn:hover,
      .btn.on {
        border-color: var(--accent2);
        color: var(--accent);
        background: var(--paper2);
      }
      .menu {
        display: none;
      }
      .main {
        height: calc(100% - 58px);
        display: flex;
        position: relative;
      }
      .side {
        width: 286px;
        flex: 0 0 auto;
        border-right: 1px solid var(--line);
        background: var(--side);
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      .side-head {
        flex-shrink: 0;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 1px;
      }
      .chapters {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 8px;
      }
      .chapter {
        border-radius: 8px;
        padding: 9px 11px;
        display: flex;
        gap: 10px;
        align-items: baseline;
        cursor: pointer;
        border-left: 3px solid transparent;
      }
      .chapter:hover {
        background: var(--paper2);
        color: var(--accent);
      }
      .chapter.active {
        background: var(--paper2);
        color: var(--accent);
        border-left-color: var(--accent);
        font-weight: 700;
      }
      .num {
        font-size: 11px;
        color: var(--muted);
      }
      .count {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .reader {
        flex: 1;
        min-width: 0;
        overflow: auto;
        position: relative;
        scroll-behavior: smooth;
      }
      .progress {
        height: 3px;
        background: var(--accent);
        width: 0;
        position: sticky;
        top: 0;
        z-index: 9;
      }
      .paper {
        max-width: 44em;
        margin: 0 auto;
        padding: 48px 34px 120px;
      }
      .book-title {
        text-align: center;
        font-size: 31px;
        margin: 0;
        letter-spacing: 5px;
      }
      .meta {
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        margin-top: 10px;
      }
      .rule {
        width: 66px;
        height: 2px;
        background: var(--accent);
        opacity: 0.55;
        margin: 20px auto 34px;
      }
      .chapter-title {
        text-align: center;
        font-size: 22px;
        color: var(--accent);
        letter-spacing: 3px;
        margin: 0 0 30px;
      }
      .chapter-title:before,
      .chapter-title:after {
        content: "◆";
        font-size: 9px;
        vertical-align: middle;
        margin: 0 12px;
        opacity: 0.55;
      }
      .entry-wrap {
        margin-bottom: 1.35em;
      }
      .entry {
        font-size: var(--fs);
        line-height: var(--lh);
        letter-spacing: 0.035em;
        text-align: justify;
        text-indent: 2em;
        margin: 0;
      }
      .entry mark {
        background: color-mix(in srgb, var(--accent) 22%, transparent);
        color: inherit;
      }
      .annotated {
        position: relative;
        border-bottom: 1px dotted var(--accent);
        cursor: pointer;
      }
      .annotated sup {
        font-size: 0.5em;
        color: var(--accent);
        margin-left: 0.08em;
      }
      .note-pop {
        display: block;
        margin: 0.45em 0 0.25em 2em;
        padding: 0.6em 0.85em;
        border-left: 2px solid var(--accent);
        background: color-mix(in srgb, var(--accent) 5%, transparent);
        color: var(--muted);
        font-size: 14px;
        line-height: 1.75;
        text-indent: 0;
      }
      .note-pop.show {
        display: block;
      }
      .note-pop b {
        color: var(--accent);
        font-weight: 600;
      }
      .translation {
        font-size: calc(var(--fs) - 2px);
        line-height: 1.85;
        color: var(--muted);
        margin: 0.55em 0 0 2em;
        padding: 0.55em 0.8em;
        border-left: 2px solid var(--accent2);
        text-indent: 0;
      }
      .translation .tag {
        display: inline-grid;
        place-items: center;
        width: 1.55em;
        height: 1.55em;
        margin-right: 0.6em;
        border: 1px solid var(--accent);
        color: var(--accent);
        font-size: 0.75em;
      }
      .missing {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        margin: -12px 0 25px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 80px 20px;
        line-height: 2;
      }
      .reader.vertical .paper {
        writing-mode: vertical-rl;
        -webkit-writing-mode: vertical-rl;
        max-width: none;
        width: max-content;
        height: 100%;
        padding: 42px 58px;
      }
      .reader.vertical .book-title,
      .reader.vertical .chapter-title {
        text-align: start;
        margin: 0 0 0 24px;
      }
      .reader.vertical .meta,
      .reader.vertical .rule {
        display: none;
      }
      .reader.vertical .entry {
        height: 100%;
        margin: 0 0 0 1.25em;
        text-indent: 2em;
      }
      .reader.vertical .translation,
      .reader.vertical .note-pop {
        height: 100%;
        margin: 0 0 0 0.8em;
        padding: 0.6em;
        border-left: 0;
        border-top: 2px solid var(--accent2);
        writing-mode: vertical-rl;
      }
      .scrim {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.35);
        z-index: 15;
      }
      .fab {
        position: fixed;
        right: 22px;
        bottom: 24px;
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 50%;
        background: var(--accent);
        color: #f7ecd6;
        box-shadow: var(--shadow);
        font-size: 20px;
        display: none;
        cursor: pointer;
      }
      .fab.show {
        display: block;
      }
      .welcome {
        max-width: 720px;
        margin: 0 auto;
        padding: 70px 30px;
        text-align: center;
      }
      .welcome .big-seal {
        width: 78px;
        height: 78px;
        border: 3px double var(--accent);
        color: var(--accent);
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        font-size: 28px;
        font-weight: 700;
      }
      .welcome h1 {
        font-size: 34px;
        letter-spacing: 8px;
        margin: 0 0 12px;
      }
      .welcome p {
        color: var(--muted);
        line-height: 1.9;
      }
      .welcome button {
        margin-top: 18px;
        background: var(--accent);
        color: #f8efd8;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        cursor: pointer;
      }
      @media (max-width: 820px) {
        .menu {
          display: inline-block;
        }
        .brand .label,
        .brand small,
        .tools .txt {
          display: none;
        }
        .top {
          padding: 0 7px;
          gap: 5px;
        }
        .search {
          min-width: 70px;
        }
        .btn {
          padding: 0 7px;
        }
        .side {
          position: absolute;
          inset: 0 auto 0 0;
          transform: translateX(-100%);
          transition: 0.22s;
          box-shadow: var(--shadow);
        }
        .side.open {
          transform: translateX(0);
        }
        .scrim.show {
          display: block;
        }
        .paper {
          padding: 32px 20px 100px;
        }
        :root {
          --fs: 18px;
        }
        .chapter-title {
          margin-bottom: 24px;
        }
      }

      :root {
        scrollbar-color: var(--muted) var(--paper2);
        scrollbar-width: thin;
      }
      * {
        scrollbar-color: var(--muted) var(--paper2);
        scrollbar-width: thin;
      }
      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-thumb {
        background: var(--muted);
        border: 2px solid var(--paper2);
        border-radius: 6px;
      }
      *::-webkit-scrollbar-track {
        background: var(--paper2);
      }
      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .chapter {
        width: 100%;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        border: 0;
        border-left: 3px solid transparent;
      }
      .progress {
        position: absolute;
        inset: 0 auto auto 0;
        pointer-events: none;
        z-index: 35;
      }
      .clear-search {
        position: absolute;
        right: 8px;
        top: 6px;
        z-index: 1;
        border: 0;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
      }
      .search input {
        padding-right: 34px;
      }
      .liu-note {
        margin: 0.6em 0 0 2em;
        padding: 0.5em 0.8em;
        border-left: 2px solid var(--accent);
        font-size: 16px;
        line-height: 1.8;
        color: var(--muted);
      }
      .liu-note summary {
        cursor: pointer;
        color: var(--accent);
      }
      .liu-note p {
        margin: 0.6em 0;
        text-indent: 0;
      }
      .annotated {
        font: inherit;
        color: inherit;
        background: transparent;
        padding: 0;
        border: 0;
        border-bottom: 1px dotted var(--accent);
      }
      #loadStatus:empty {
        display: none;
      }
      #loadStatus {
        padding: 8px 14px;
        background: var(--paper2);
        font-size: 14px;
        line-height: 1.7;
      }
      #loadStatus button {
        margin-left: 8px;
      }
      .reader.vertical {
        direction: rtl;
        scrollbar-gutter: auto;
      }
      .reader.vertical #content {
        height: 100%;
        width: max-content;
        min-width: 100%;
        direction: ltr;
      }
      .reader.vertical .entry-wrap {
        height: 100%;
        margin: 0 0 0 1.35em;
      }
      .reader.vertical .liu-note {
        height: 100%;
        margin: 0 0 0 0.8em;
        border-left: 0;
        border-top: 2px solid var(--accent);
        max-width: none;
      }
      .reader.vertical #loadStatus {
        position: absolute;
        top: 4px;
        right: 10px;
        z-index: 10;
        max-width: 90%;
        direction: ltr;
      }
      .reader.vertical .fab {
        position: fixed;
      }
      .top {
        height: auto;
        min-height: 58px;
        flex-wrap: wrap;
      }
      .main {
        height: calc(100dvh - var(--top-height, 58px));
      }
      .tools {
        flex-shrink: 0;
      }
      .reader {
        scroll-behavior: auto;
        scrollbar-gutter: stable;
      }
      .chapter[aria-current="page"] {
        font-weight: 700;
      }
      @media (max-width: 440px) {
        .top .search {
          order: 3;
          max-width: none;
          flex-basis: 100%;
          margin-bottom: 6px;
        }
        .tools {
          gap: 3px;
        }
        .btn {
          min-width: 32px;
        }
        .brand {
          margin-right: auto;
        }
        .paper {
          padding-left: 16px;
          padding-right: 16px;
        }
        .reader.vertical .paper {
          padding: 48px 28px;
        }
        .liu-note {
          margin-left: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
      @media (forced-colors: active) {
        * {
          scrollbar-color: auto;
        }
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="top">
      <button
        aria-controls="side"
        aria-expanded="false"
        id="menuBtn"
        aria-label="打开目录"
        class="btn menu"
      >
        ☰
      </button>
      <div class="brand">
        <span class="seal">世</span><span class="label">世说新语</span
        ><small>刘义庆 撰 · 刘孝标 注</small>
      </div>
      <div class="search">
        <button
          id="clearSearch"
          class="clear-search"
          aria-label="清除检索"
          hidden
        >
          ×</button
        ><input
          aria-label="检索当前篇正文"
          id="search"
          type="search"
          placeholder="检索当前篇正文…"
          autocomplete="off"
        />
      </div>
      <div class="tools">
        <button id="homeBtn" class="btn" title="首页">⌂</button
        ><button id="minusBtn" aria-label="缩小字号" class="btn">A−</button
        ><button id="plusBtn" aria-label="放大字号" class="btn">A＋</button
        ><button id="notesBtn" class="btn" title="显示注释">注</button
        ><button id="transBtn" class="btn" title="显示译文">译</button
        ><button id="dirBtn" aria-label="切换横竖排" class="btn" title="横竖排">
          <span class="txt">竖排</span>↔</button
        ><button id="themeBtn" aria-label="切换主题" class="btn">☾</button>
      </div>
    </header>
    <div class="main">
      <div
        id="progress"
        class="progress"
        role="progressbar"
        aria-label="阅读进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      ></div>
      <div id="scrim" class="scrim"></div>
      <aside id="side" class="side">
        <div class="side-head">
          <span>三十六门</span><span id="total"></span>
        </div>
        <nav id="chapters" class="chapters"></nav>
      </aside>
      <main id="reader" class="reader">
        <div id="loadStatus" role="status" aria-live="polite"></div>
        <div id="content"><div class="empty">正在加载正文…</div></div>
        <button id="topBtn" aria-label="返回阅读起点" class="fab">↑</button>
      </main>
    </div>
    <script src="./assets/reader.js" defer></script>
  </body>
</html>
